name: Simple Node Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Add production host to known hosts
        shell: bash
        env:
          HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production
        shell: bash
        env:
          HOST: ${{ secrets.PROD_HOST }}
          KEY: ${{ secrets.PROD_KEY }}
        run: |
          set -euo pipefail
          trap 'rm -f web-project.pem' EXIT

          printf '%s' "$KEY" | tr -d '\r' > web-project.pem
          chmod 600 web-project.pem

          echo "Validating SSH private key..."
          ssh-keygen -y -f web-project.pem > /dev/null

          ssh \
            -o IdentitiesOnly=yes \
            -i web-project.pem \
            ubuntu@"$HOST" << 'EOF'
            set -euo pipefail

            APP_DIR="/home/ubuntu/simple-node-project"
            APP_PORT="3000"

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "NVM was not found at $NVM_DIR/nvm.sh"
              exit 1
            fi

            echo "Node version:"
            node -v

            echo "npm version:"
            npm -v

            echo "PM2 version:"
            pm2 -v

            cd "$APP_DIR"

            git fetch origin
            git reset --hard origin/main

            npm ci --omit=dev

            pm2 startOrReload ecosystem.config.js \
              --env production \
              --update-env

            pm2 save

            curl \
              --fail \
              --silent \
              --show-error \
              "http://127.0.0.1:${APP_PORT}/health"

            echo "Production deployment completed successfully."
          EOF
