name: Simple Node Project

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Add production host to known hosts
        shell: bash
        env:
          HOST: ${{ secrets.PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy to production
        shell: bash
        env:
          HOST: ${{ secrets.PROD_HOST }}
          KEY: ${{ secrets.PROD_KEY }}
        run: |
          printf '%s\n' "$KEY" > web-project.pem
          chmod 600 web-project.pem

          ssh -i web-project.pem ubuntu@"$HOST" << 'EOF'
            set -e

            cd /home/ubuntu/simple-node-project
            git fetch origin
            git reset --hard origin/main
            npm ci --omit=dev
            pm2 restart simple-node-api
            pm2 save
          EOF

          rm -f web-project.pem

  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add staging host to known hosts
        shell: bash
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy to staging
        shell: bash
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          KEY: ${{ secrets.STAGING_KEY }}
        run: |
          printf '%s\n' "$KEY" > web-project.pem
          chmod 600 web-project.pem

          ssh -i web-project.pem ubuntu@"$HOST" << 'EOF'
            set -e

            cd /home/ubuntu/simple-node-project
            git fetch origin
            git reset --hard origin/staging
            npm ci
            pm2 restart simple-node-api
            pm2 save
          EOF

          rm -f web-project.pem
