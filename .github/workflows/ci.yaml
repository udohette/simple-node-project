name: Simple Node Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Add production host to known hosts
        shell: bash
        env:
          HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production
        shell: bash
        env:
          HOST: ${{ secrets.PROD_HOST }}
          KEY: ${{ secrets.PROD_KEY }}
        run: |
          set -euo pipefail
          trap 'rm -f web-project.pem' EXIT

          printf '%s\n' "$KEY" > web-project.pem
          chmod 600 web-project.pem

          ssh -i web-project.pem ubuntu@"$HOST" << 'EOF'
            set -euo pipefail

            APP_DIR="/home/ubuntu/simple-node-project"
            APP_PORT="3000"

            cd "$APP_DIR"

            git fetch origin
            git reset --hard origin/main

            npm ci --omit=dev

            pm2 startOrReload ecosystem.config.js \
              --env production \
              --update-env

            pm2 save

            curl --fail --silent --show-error \
              "http://127.0.0.1:${APP_PORT}/health"
          EOF
